<!DOCTYPE html>
<html>
<head>
    <title>Змейка - FlorestAPI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            touch-action: none; /* Prevent default touch behaviors like scrolling */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        canvas {
            border: 3px solid #333;
            margin-top: 10px;
            background-color: #000;
            max-width: 100%;
        }
        .info {
            margin-top: 10px;
            font-size: clamp(14px, 4vw, 16px);
            text-align: center;
        }
        h1 {
            color: #2e8b57;
            font-size: clamp(20px, 6vw, 24px);
            margin: 10px 0;
        }
        .controls {
            margin-top: 10px;
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 8px;
            justify-content: center;
        }
        .control-btn {
            width: clamp(40px, 12vw, 50px);
            height: clamp(40px, 12vw, 50px);
            font-size: clamp(16px, 5vw, 20px);
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .control-btn:active {
            background-color: #2E8B57;
        }
        #up-btn { grid-area: up; }
        #left-btn { grid-area: left; }
        #down-btn { grid-area: down; }
        #right-btn { grid-area: right; }
    </style>
</head>
<body>
    <h1>Змейка от Флореста!</h1>
    <div class="info">
        <p>Счёт: <span id="score" style="font-weight:bold">0</span></p>
        <p>Управление: стрелки клавиатуры или кнопки ниже</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls">
        <button id="up-btn" class="control-btn">↑</button>
        <button id="left-btn" class="control-btn">←</button>
        <button id="down-btn" class="control-btn">↓</button>
        <button id="right-btn" class="control-btn">→</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // Responsive canvas size
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        canvas.width = Math.floor(size / 20) * 20; // Ensure divisibility by gridSize
        canvas.height = canvas.width;

        // Настройки игры
        const gridSize = canvas.width / 20;
        const tileCount = 20;
        let score = 0;
        let gameSpeed = 120;
        let gameRunning = true;

        // Змейка
        let snake = [{x: 10, y: 10}];
        let velocityX = 0;
        let velocityY = 0;

        // Еда
        let food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };

        // Рисование с закругленными углами
        function roundRect(x, y, width, height, radius, color) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        // Игровой цикл
        function gameLoop() {
            if (!gameRunning) return;

            // Очистка поля
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем змейку
            for (let i = 0; i < snake.length; i++) {
                const color = i === 0 ? '#4CAF50' : '#2E8B57';
                roundRect(
                    snake[i].x * gridSize + 1, 
                    snake[i].y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2, 
                    gridSize * 0.15, // Scaled radius
                    color
                );
            }

            // Рисуем еду
            roundRect(
                food.x * gridSize + 1, 
                food.y * gridSize + 1, 
                gridSize - 2, 
                gridSize - 2, 
                gridSize * 0.5, // Scaled radius
                '#FF5252'
            );

            // Двигаем змейку
            const head = {
                x: snake[0].x + velocityX,
                y: snake[0].y + velocityY
            };
            snake.unshift(head);

            // Проверка на съедание еды
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                if (score % 5 === 0 && gameSpeed > 60) {
                    gameSpeed -= 5;
                }
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } else {
                snake.pop();
            }

            // Проверка на столкновение с границами
            if (
                head.x < 0 || 
                head.y < 0 || 
                head.x >= tileCount || 
                head.y >= tileCount
            ) {
                gameOver();
                return;
            }

            // Проверка на столкновение с собой
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            setTimeout(gameLoop, gameSpeed);
        }

        function gameOver() {
            gameRunning = false;
            alert(`Игра окончена! Ваш счёт: ${score}\nНажмите OK для перезапуска`);
            resetGame();
        }

        function resetGame() {
            score = 0;
            scoreElement.textContent = score;
            snake = [{x: 10, y: 10}];
            velocityX = 0;
            velocityY = 0;
            gameSpeed = 120;
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            gameRunning = true;
            setTimeout(gameLoop, gameSpeed);
        }

        // Управление клавиатурой
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }

            const key = e.key;
            if (key === 'ArrowUp' && velocityY !== 1) {
                velocityX = 0;
                velocityY = -1;
            } else if (key === 'ArrowDown' && velocityY !== -1) {
                velocityX = 0;
                velocityY = 1;
            } else if (key === 'ArrowLeft' && velocityX !== 1) {
                velocityX = -1;
                velocityY = 0;
            } else if (key === 'ArrowRight' && velocityX !== -1) {
                velocityX = 1;
                velocityY = 0;
            }
        });

        // Управление кнопками
        document.getElementById('up-btn').addEventListener('click', () => {
            if (velocityY !== 1) {
                velocityX = 0;
                velocityY = -1;
            }
        });
        document.getElementById('left-btn').addEventListener('click', () => {
            if (velocityX !== 1) {
                velocityX = -1;
                velocityY = 0;
            }
        });
        document.getElementById('down-btn').addEventListener('click', () => {
            if (velocityY !== -1) {
                velocityX = 0;
                velocityY = 1;
            }
        });
        document.getElementById('right-btn').addEventListener('click', () => {
            if (velocityX !== -1) {
                velocityX = 1;
                velocityY = 0;
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth, window.innerHeight) * 0.9;
            canvas.width = Math.floor(newSize / 20) * 20;
            canvas.height = canvas.width;
            // Update gridSize for rendering
            window.gridSize = canvas.width / 20;
        });

        // Запускаем игру
        resetGame();
    </script>
</body>
</html>
